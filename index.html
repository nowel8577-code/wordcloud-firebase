<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時文字雲（Firebase 版）</title>
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 22px 20px 18px;
      color: white;
    }
    header h1 {
      font-size: 2em;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.45em;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      vertical-align: middle;
    }
    .badge-live { background: #22c55e; color: white; }
    .badge-fb   { background: #1877f2; color: white; }
    header p { font-size: 0.95em; opacity: 0.9; margin-top: 4px; }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 0 16px 16px;
      min-height: 0;
    }

    /* ── Left panel ── */
    .left {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .card-title {
      font-size: 0.9em;
      font-weight: 700;
      color: #555;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Input */
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1em;
      outline: none;
    }
    .input-row input:focus { border-color: #f97316; }
    .btn-submit {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .stat-box {
      flex: 1;
      text-align: center;
      background: #fff7ed;
      border-radius: 10px;
      padding: 10px;
    }
    .stat-num { font-size: 1.8em; font-weight: 700; color: #f97316; }
    .stat-label { font-size: 0.72em; color: #999; margin-top: 2px; }

    /* Toast */
    .toast {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      display: none;
    }
    .toast.ok  { background: #dcfce7; color: #16a34a; display: block; }
    .toast.err { background: #fee2e2; color: #dc2626; display: block; }

    /* Ranking */
    .rank-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9em;
    }
    .rank-num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #f97316;
      color: white;
      font-size: 0.78em;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .rank-num.gold   { background: #f59e0b; }
    .rank-num.silver { background: #9ca3af; }
    .rank-num.bronze { background: #b45309; }
    .rank-word { flex: 1; color: #333; font-weight: 500; }
    .rank-count {
      background: #fff7ed;
      color: #f97316;
      font-weight: 700;
      font-size: 0.82em;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .empty-rank { color: #bbb; font-size: 0.85em; text-align: center; padding: 10px 0; }

    /* ── Right panel (word cloud) ── */
    .right {
      flex: 1;
      min-width: 0;
    }
    .cloud-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      height: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    .cloud-card .card-title { margin-bottom: 8px; }
    #canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 300px;
    }
    canvas { display: block; }
    .cloud-empty {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center; color: #ddd;
    }
    .cloud-empty .icon { font-size: 3em; margin-bottom: 8px; }
    .cloud-empty p { font-size: 0.9em; }

    /* live dot */
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #22c55e; border-radius: 50%;
      margin-right: 4px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* QR Code card */
    .qr-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qr-box {
      background: white;
      border: 3px solid #f97316;
      border-radius: 12px;
      padding: 10px;
      display: inline-block;
    }
    .qr-hint {
      font-size: 0.8em;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
    .qr-url {
      font-size: 0.68em;
      color: #bbb;
      text-align: center;
      word-break: break-all;
    }

    /* Responsive: mobile → stack vertically */
    @media (max-width: 680px) {
      main { flex-direction: column; }
      .left { width: 100%; }
      .cloud-card { min-height: 320px; }
    }
  </style>
</head>
<body>

<header>
  <h1>
    ☁️ 即時文字雲
    <span class="badge badge-live">LIVE</span>
    <span class="badge badge-fb">Firebase</span>
  </h1>
  <p>輸入關鍵字，全班即時看到結果</p>
</header>

<main>
  <!-- Left -->
  <div class="left">

    <!-- Input card -->
    <div class="card">
      <div class="card-title">✏️ 提交關鍵字</div>
      <div class="input-row">
        <input type="text" id="wordInput" placeholder="輸入關鍵字..." maxlength="20">
        <button class="btn-submit" id="submitBtn" onclick="submitWord()">提交</button>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="totalCount">0</div>
          <div class="stat-label">提交次數</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="uniqueCount">0</div>
          <div class="stat-label">不同關鍵字</div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <!-- QR Code card -->
    <div class="card">
      <div class="card-title">📱 掃碼參與</div>
      <div class="qr-inner">
        <div class="qr-box" id="qrcode"></div>
        <div class="qr-hint">用手機掃描<br>輸入你的關鍵字</div>
        <div class="qr-url" id="qrUrl"></div>
      </div>
    </div>

    <!-- Ranking card -->
    <div class="card">
      <div class="card-title">🏆 排行榜</div>
      <ul class="rank-list" id="rankList">
        <li class="empty-rank">還沒有資料</li>
      </ul>
    </div>

  </div>

  <!-- Right: word cloud -->
  <div class="right">
    <div class="cloud-card">
      <div class="card-title">
        <span class="live-dot"></span>文字雲展示
      </div>
      <div id="canvas-wrap">
        <div class="cloud-empty" id="cloudEmpty">
          <div class="icon">🌫️</div>
          <p>等待關鍵字…</p>
        </div>
        <canvas id="cloud"></canvas>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ── QR Code ──
  const INPUT_URL = window.location.origin.includes('github.io')
    ? 'https://nowel8577-code.github.io/wordcloud-firebase/'
    : window.location.href.split('?')[0];
  document.getElementById('qrUrl').textContent = INPUT_URL;
  new QRCode(document.getElementById('qrcode'), {
    text: INPUT_URL,
    width: 140, height: 140,
    colorDark: '#f97316',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  const app = initializeApp({
    apiKey: "AIzaSyA0HmfkjwykzJ4JyIqlhKUmMCKc9o6gdyY",
    authDomain: "teacherstudy-38c15.firebaseapp.com",
    projectId: "teacherstudy-38c15",
    storageBucket: "teacherstudy-38c15.firebasestorage.app",
    messagingSenderId: "768803476729",
    appId: "1:768803476729:web:8463219b03f9312ac5fe28"
  });
  const db = getFirestore(app);

  const COLORS = ['#f97316','#ef4444','#8b5cf6','#3b82f6','#10b981',
                  '#f59e0b','#ec4899','#06b6d4','#84cc16','#6366f1'];

  let wordMap = {};
  let renderTimer = null;

  // ── Submit ──
  window.submitWord = async function() {
    const input = document.getElementById('wordInput');
    const word = input.value.trim();
    if (!word) return;

    const btn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');
    btn.disabled = true;
    btn.textContent = '送出中…';

    try {
      await addDoc(collection(db, 'wordcloud_words'), {
        word, submitted_at: serverTimestamp()
      });
      toast.className = 'toast ok';
      toast.textContent = `✅「${word}」已送出！`;
      input.value = '';
    } catch(e) {
      toast.className = 'toast err';
      toast.textContent = '❌ 失敗：' + e.message;
    }
    btn.disabled = false;
    btn.textContent = '提交';
    input.focus();
    setTimeout(() => toast.className = 'toast', 3000);
  };

  document.getElementById('wordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.submitWord();
  });

  // ── Word cloud render ──
  function renderCloud() {
    const canvas = document.getElementById('cloud');
    const wrap = document.getElementById('canvas-wrap');
    canvas.width  = wrap.offsetWidth;
    canvas.height = wrap.offsetHeight;

    const list = Object.entries(wordMap).sort((a,b) => b[1]-a[1]);
    const max  = list[0]?.[1] || 1;

    document.getElementById('cloudEmpty').style.display = list.length ? 'none' : 'flex';
    if (!list.length) return;

    WordCloud(canvas, {
      list: list.map(([word, count]) => [
        word, Math.max(16, Math.round(16 + (count/max) * 80))
      ]),
      gridSize: 8,
      fontFamily: 'Segoe UI, Microsoft JhengHei, sans-serif',
      color: (word) => {
        const i = list.findIndex(([w]) => w === word);
        return COLORS[i % COLORS.length];
      },
      rotateRatio: 0.2,
      backgroundColor: 'transparent',
      drawOutOfBound: false,
    });
  }

  // ── Ranking ──
  function renderRank() {
    const list = Object.entries(wordMap).sort((a,b) => b[1]-a[1]).slice(0, 10);
    const el = document.getElementById('rankList');
    if (!list.length) {
      el.innerHTML = '<li class="empty-rank">還沒有資料</li>';
      return;
    }
    const medalClass = ['gold','silver','bronze'];
    el.innerHTML = list.map(([word, count], i) => `
      <li class="rank-item">
        <span class="rank-num ${medalClass[i]||''}">${i+1}</span>
        <span class="rank-word">${word}</span>
        <span class="rank-count">${count}</span>
      </li>
    `).join('');
  }

  // ── Firestore listener ──
  onSnapshot(collection(db, 'wordcloud_words'), (snap) => {
    wordMap = {};
    let total = 0;
    snap.forEach(doc => {
      const w = doc.data().word;
      if (w) { wordMap[w] = (wordMap[w]||0)+1; total++; }
    });
    document.getElementById('totalCount').textContent  = total;
    document.getElementById('uniqueCount').textContent = Object.keys(wordMap).length;
    renderRank();
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderCloud, 300);
  });

  window.addEventListener('resize', () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderCloud, 200);
  });
</script>
</body>
</html>
